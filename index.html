<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>🕹️|Tetris</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>TETRIS</h1>
    <div class="game-area">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="sidebar">
            <div class="panel">
                <h3>Prossimo</h3>
                <canvas id="next" width="120" height="120"></canvas>
            </div>
            <div class="panel">
                <h3>Punteggio</h3>
                <p id="score">0</p>
            </div>
            <div class="panel">
                <h3>Livello</h3>
                <p id="level">1</p>
            </div>
            <div class="panel">
                <h3>Righe</h3>
                <p id="lines">0</p> 
            </div>
            <button id="startBtn">Avvia / Pausa</button>
<button id="toggleTouch">📱 Controlli Touch: OFF</button>

<div id="touchControls" class="hidden">
  <div class="touch-row">
    <button id="btnRotate">⟳</button>
  </div>
  <div class="touch-row">
    <button id="btnLeft">⬅️</button>
    <button id="btnDown">⬇️</button>
    <button id="btnRight">➡️</button>
  </div>
  <div class="touch-row">
    <button id="btnDrop">⏬ Fallo Cadere</button>
  </div>
</div>
            <p class="controls">
                ⬅️ ➡️ : Muovi<br>
                ⬇️ : scendi Veloce<br>
                ⬆️ : Ruota<br>
                Spazio : Fallo Cadere
            </p>
            <p id="gameOverMsg" class="hidden">GAME OVER</p>
            <button id="creditsBtn">Credits</button>

<div id="creditsModal" class="hidden">
  <div class="credits-box">
    <h2>TETRIS</h2>
    <p>Programmed by <strong>NoskynHK</strong></p>
    <p>Idea by <strong>Sig.Lev</strong></p>
    <button id="closeCredits">Close</button>
  </div>
</div>
        </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
