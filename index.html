<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>🕹️|Tetris</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>TETRIS</h1>
    <div class="game-area">
        <canvas id="board" width="300" height="600"></canvas>
        <div class="sidebar">
            <div class="panel">
                <h3>Prossimo</h3>
                <canvas id="next" width="120" height="120"></canvas>
            </div>
            <div class="panel">
                <h3>Punteggio</h3>
                <p id="score">0</p>
            </div>
            <div class="panel">
                <h3>Livello</h3>
                <p id="level">1</p>
            </div>
            <div calss="panel">
                <h3>Righe</h3>
                <p id="lines">0</p> 
            </div>
            <button id="startBtn">Avvia / Pausa</button>
            <p class="controls">
                ⬅️ ➡️ : Muovi<br>
                ⬇️ : scendi Veloce<br>
                ⬆️ : Ruota<br>
                Spazio : Fallo Cadere
            </p>
            <p id="gameOverMsg" class="hidden">GAME OVER</p>
        </div>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
